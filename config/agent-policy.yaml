# Desired policy values. Not injected as OpenCode instructions.
# The Coordinator reads this file when planning or delegating.
# Native enforcement limitations: docs/process/multi-agent-orchestration.md §3.
# This file is the single source of truth for the concrete limit values.
agents:
  coordinator:
    implementation_allowed: false
workers:
  max_parallel: 3
  isolated_worktrees: true
retries:
  default_max_corrections_per_issue: 3
  limit_change_requires_human_approval: true
integration:
  base_branch: main
  fspec_branch_prefix: fspec/
  require_tests: true
  require_documentation: true
  require_spec_compliance: true
  remove_verified_task_worktrees: true
logging:
  automatic: false
  optional_telemetry_nonblocking: true
